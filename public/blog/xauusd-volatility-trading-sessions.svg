    <line x1="297.5" y1="174.6369384430727" x2="297.5" y2="197.5097307956104" stroke="#00e676" stroke-width="1.5" opacity="0.5"/><rect x="290.5" y="182.67411479766804" width="14.000000000000002" height="6.79843964334705" fill="#00e676" opacity="0.7" rx="1"/><line x1="322.5" y1="172.6017232510288" x2="322.5" y2="194.9440372085048" stroke="#ff7043" stroke-width="1.5" opacity="0.5"/><rect x="315.5" y="178.11937371399176" width="14.000000000000002" height="11.307013031550069" fill="#ff7043" opacity="0.7" rx="1"/><line x1="347.5" y1="179.100844478738" x2="347.5" y2="202.2596450617284" stroke="#00e676" stroke-width="1.5" opacity="0.5"/><rect x="340.5" y="187.6802447702332" width="14.000000000000002" height="6" fill="#00e676" opacity="0.7" rx="1"/><line x1="372.5" y1="167.15783607681757" x2="372.5" y2="199.82808213305898" stroke="#ff7043" stroke-width="1.5" opacity="0.5"/><rect x="365.5" y="176.17038537379975" width="14.000000000000002" height="14.645147462277093" fill="#ff7043" opacity="0.7" rx="1"/><line x1="397.5" y1="172.09792952674897" x2="397.5" y2="202.01547496570643" stroke="#ff7043" stroke-width="1.5" opacity="0.5"/><rect x="390.5" y="182.04774305555554" width="14.000000000000002" height="10.017918381344305" fill="#ff7043" opacity="0.7" rx="1"/><line x1="422.5" y1="163.37547153635117" x2="422.5" y2="207.57735339506175" stroke="#ff7043" stroke-width="1.5" opacity="0.5"/><rect x="415.5" y="173.68641760973938" width="14.000000000000002" height="23.579989711934157" fill="#ff7043" opacity="0.7" rx="1"/><line x1="447.5" y1="169.9102151920439" x2="447.5" y2="188.21124828532237" stroke="#ff7043" stroke-width="1.5" opacity="0.5"/><rect x="440.5" y="173.7407300240055" width="14.000000000000002" height="10.64000342935528" fill="#ff7043" opacity="0.7" rx="1"/>
