  <!-- Session chips -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <rect x="80" y="406" width="120" height="44" rx="22" fill="#ffffff" opacity="0.04" stroke="#9ca3af" stroke-opacity="0.3" stroke-width="1"/>
    <text x="140" y="434" font-size="14" font-weight="700" fill="#9ca3af" text-anchor="middle">Asia</text>

    <rect x="212" y="406" width="120" height="44" rx="22" fill="#ffffff" opacity="0.04" stroke="#ffd740" stroke-opacity="0.3" stroke-width="1"/>
