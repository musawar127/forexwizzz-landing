<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="55%" style="stop-color:#0d0f16"/>
      <stop offset="100%" style="stop-color:#0a0a0f"/>
    </linearGradient>
    <linearGradient id="greenGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00e676"/>
      <stop offset="100%" style="stop-color:#ffd740"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative glows -->
  <circle cx="980" cy="120" r="220" fill="#00e676" opacity="0.05"/>
  <circle cx="180" cy="540" r="180" fill="#ffd740" opacity="0.05"/>

  <!-- Educational signal-card visual (right side) — NO live prices -->
  <g transform="translate(700, 150)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <rect x="0" y="0" width="420" height="420" rx="20" fill="#ffffff" opacity="0.04" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>

    <!-- Card header -->
    <rect x="0" y="0" width="420" height="56" rx="20" fill="#00e676" opacity="0.08"/>
    <rect x="0" y="36" width="420" height="20" fill="#00e676" opacity="0.08"/>
    <circle cx="32" cy="28" r="8" fill="#00e676" filter="url(#softGlow)"/>
    <text x="52" y="34" font-size="16" font-weight="800" fill="#00e676">EUR/USD</text>
    <text x="388" y="34" font-size="14" font-weight="700" fill="#00e676" text-anchor="end">BUY</text>

    <!-- ENTRY -->
    <text x="28" y="100" font-size="11" font-weight="700" fill="#9ca3af" letter-spacing="1.2">ENTRY</text>
    <text x="28" y="128" font-size="20" font-weight="800" fill="#f0f0f0">1.1000 – 1.1010</text>
    <line x1="28" y1="146" x2="392" y2="146" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

    <!-- SL -->
    <text x="28" y="174" font-size="11" font-weight="700" fill="#ff1744" letter-spacing="1.2">SL</text>
    <text x="28" y="202" font-size="20" font-weight="800" fill="#ff7043">1.0970</text>
    <line x1="28" y1="220" x2="392" y2="220" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

    <!-- TP1 -->
    <text x="28" y="248" font-size="11" font-weight="700" fill="#ffd740" letter-spacing="1.2">TP1</text>
    <text x="28" y="276" font-size="20" font-weight="800" fill="#ffd740">1.1040</text>
    <line x1="28" y1="294" x2="392" y2="294" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

    <!-- TP2 -->
    <text x="28" y="322" font-size="11" font-weight="700" fill="#ffd740" letter-spacing="1.2">TP2</text>
    <text x="28" y="350" font-size="20" font-weight="800" fill="#ffd740">1.1070</text>
    <line x1="28" y1="368" x2="392" y2="368" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

    <!-- TP3 -->
    <text x="28" y="396" font-size="11" font-weight="700" fill="#ffd740" letter-spacing="1.2">TP3</text>
    <text x="28" y="424" font-size="20" font-weight="800" fill="#ffd740">1.1100</text>

    <!-- Hypothetical note -->
    <text x="210" y="470" font-size="10" font-weight="500" fill="#6b7280" text-anchor="middle">Hypothetical educational example — not a live signal</text>
  </g>

  <!-- Brand row (official logo as small mark) -->
  <g>
    <circle cx="80" cy="70" r="9" fill="#00e676" filter="url(#softGlow)"/>
    <text x="100" y="78" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800" fill="#f0f0f0" letter-spacing="-0.5">
      Forex <tspan fill="#00e676">Wizard</tspan>
    </text>
  </g>

  <!-- Eyebrow / section label -->
  <rect x="80" y="150" width="180" height="40" rx="20" fill="#00e676" opacity="0.08" stroke="#00e676" stroke-opacity="0.35" stroke-width="1"/>
  <text x="170" y="176" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#00e676" text-anchor="middle" letter-spacing="1.5">
    BEGINNER GUIDE
  </text>

  <!-- Main title -->
  <text x="80" y="258" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="900" fill="#f0f0f0" letter-spacing="-1.5">
    How to Read
  </text>
  <text x="80" y="320" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="900" letter-spacing="-1.5">
    <tspan fill="#00e676">Forex</tspan><tspan fill="#f0f0f0"> Signals</tspan>
  </text>

  <!-- Secondary line -->
  <text x="80" y="372" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="600" fill="#9ca3af">
    ENTRY · SL · TP · BE
  </text>

  <!-- Footer accent + disclaimer -->
  <rect x="80" y="600" width="1040" height="2" rx="1" fill="url(#greenGold)" opacity="0.4"/>
  <text x="80" y="624" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#6b7280">
    Educational guide · forexwizard.online · Not financial advice
  </text>
</svg>